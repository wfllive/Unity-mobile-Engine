<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WFL Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0b0e14; color: #e6e6e6;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
      overscroll-behavior: none;
    }
    /* Жесты гасим только над сценой: списки и панели должны прокручиваться пальцем */
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

    /* Экран загрузки */
    #boot {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(circle at 50% 40%, #16202e 0%, #0b0e14 70%);
      transition: opacity .45s ease;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    .boot-logo {
      font-size: 40px; font-weight: 800; letter-spacing: 6px;
      background: linear-gradient(90deg, #4fc3f7, #a78bfa, #4fc3f7);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: shine 3s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }
    .boot-sub { font-size: 12px; color: #64748b; letter-spacing: 2px; text-transform: uppercase; }
    .boot-bar { width: 230px; height: 3px; background: #1e293b; border-radius: 3px; overflow: hidden; }
    .boot-fill {
      height: 100%; width: 0%; border-radius: 3px;
      background: linear-gradient(90deg, #4fc3f7, #a78bfa);
      transition: width .3s ease;
    }
    .boot-status { font-size: 11px; color: #475569; height: 14px; }

  </style>
</head>
<body>
  <div id="app"></div>

  <div id="boot">
    <div class="boot-logo">WFL</div>
    <div class="boot-sub">Game Engine</div>
    <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-status" id="boot-status">инициализация…</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
